<!DOCTYPE html>
<html lang="lv">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        TeamyTasker!
        {% endblock %}
        | TeamyTasker!
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header class="main-header">

    <div class="header-content">

        <a
            href="/"
            class="logo"
        >
            TeamyTasker!
        </a>

        {% if session.get("user_id") %}

        <nav class="main-nav">

            <a href="/">
                Sākums
            </a>

            <a href="/tasks">
                Uzdevumi
            </a>

            <a href="/team">
                Komanda
            </a>

        </nav>

        <div class="user-menu">

            <span>
                {{ session.get("user_name") }}
            </span>

            <a href="/logout">
                Izrakstīties
            </a>

        </div>

        {% endif %}

    </div>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer class="main-footer">

    <p>
        TeamyTasker! — virtuāls uzdevumu plānotājs komandai
    </p>

</footer>

</body>

</html>
