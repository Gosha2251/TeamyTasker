{% extends "base.html" %}

{% block title %}
Rediģēt uzdevumu
{% endblock %}

{% block content %}

<p>
    <a href="/tasks/{{ task.id }}">
        ← Atpakaļ uz uzdevumu
    </a>
</p>

<h1>Rediģēt uzdevumu</h1>

<div class="card form-card">

    {% if error %}
        <p class="error-message">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <p>
            <label for="title">
                Nosaukums
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ task.title }}"
                required
            >
        </p>

        <p>
            <label for="description">
                Apraksts
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
            >{{ task.description }}</textarea>
        </p>

        <p>
            <label for="status_id">
                Statuss
            </label>

            <select
                id="status_id"
                name="status_id"
                required
            >

                {% for status in statuses %}

                    <option
                        value="{{ status.id }}"
                        {% if status.id == task.status_id %}
                            selected
                        {% endif %}
                    >
                        {{ status.name }}
                    </option>

                {% endfor %}

            </select>
        </p>

        <p>
            <label for="assigned_to">
                Atbildīgais
            </label>

            <select
                id="assigned_to"
                name="assigned_to"
                required
            >

                {% for user in users %}

                    <option
                        value="{{ user.id }}"
                        {% if user.id == task.assigned_to %}
                            selected
                        {% endif %}
                    >
                        {{ user.name }}
                    </option>

                {% endfor %}

            </select>
        </p>

        <button type="submit">
            Saglabāt izmaiņas
        </button>

    </form>

</div>

{% endblock %}
