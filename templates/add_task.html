{% extends "base.html" %}

{% block title %}
Pievienot uzdevumu
{% endblock %}

{% block content %}

<p>
    <a href="/tasks">← Atpakaļ uz uzdevumiem</a>
</p>

<h1>Pievienot uzdevumu</h1>

<div class="card form-card">

    {% if error %}
        <p class="error-message">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <p>
            <label for="title">
                Nosaukums
            </label>

            <input
                type="text"
                id="title"
                name="title"
                required
            >
        </p>

        <p>
            <label for="description">
                Apraksts
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
            ></textarea>
        </p>

        <p>
            <label for="status_id">
                Statuss
            </label>

            <select
                id="status_id"
                name="status_id"
                required
            >

                {% for status in statuses %}

                    <option value="{{ status.id }}">
                        {{ status.name }}
                    </option>

                {% endfor %}

            </select>
        </p>

        <p>
            <label for="assigned_to">
                Atbildīgais
            </label>

            <select
                id="assigned_to"
                name="assigned_to"
                required
            >

                {% for member in members %}

                    <option value="{{ member.id }}">
                        {{ member.name }} ({{ member.email }})
                    </option>

                {% endfor %}

            </select>
        </p>

        <button type="submit">
            Pievienot uzdevumu
        </button>

    </form>

</div>

{% endblock %}
