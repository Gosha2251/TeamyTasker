{% extends "base.html" %}

{% block title %}
Pieteikšanās
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="card auth-card">

        <h1>Pieteikšanās</h1>

        <p class="muted-text">
            Piesakies savā kontā, lai turpinātu darbu.
        </p>

        {% if error %}
            <p class="error-message">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <p>
                <label for="email">
                    E-pasts
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="lietotajs@example.com"
                    required
                >
            </p>

            <p>
                <label for="password">
                    Parole
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </p>

            <button type="submit">
                Pieteikties
            </button>

        </form>

        <hr>

        <p>
            Nav konta?
            <a href="/register">Reģistrēties</a>
        </p>

        <p>
            <a href="/welcome">← Atpakaļ</a>
        </p>

    </div>

</div>

{% endblock %}
