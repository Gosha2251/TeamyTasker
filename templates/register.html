{% extends "base.html" %}

{% block title %}
Reģistrācija
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="card auth-card">

        <h1>Reģistrācija</h1>

        <p class="muted-text">
            Izveido lietotāja kontu, lai sāktu darbu sistēmā.
        </p>

        {% if error %}
            <p class="error-message">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <p>
                <label for="name">
                    Vārds
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </p>

            <p>
                <label for="email">
                    E-pasts
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="lietotajs@example.com"
                    required
                >
            </p>

            <p>
                <label for="password">
                    Parole
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </p>

            <p>
                <label for="password_confirm">
                    Atkārto paroli
                </label>

                <input
                    type="password"
                    id="password_confirm"
                    name="password_confirm"
                    required
                >
            </p>

            <button type="submit">
                Reģistrēties
            </button>

        </form>

        <hr>

        <p>
            Jau ir konts?
            <a href="/login">Pieteikties</a>
        </p>

        <p>
            <a href="/welcome">← Atpakaļ</a>
        </p>

    </div>

</div>

{% endblock %}
