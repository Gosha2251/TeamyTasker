{% extends "base.html" %}

{% block title %}
Izveidot komandu
{% endblock %}

{% block content %}

<p>
    <a href="/team">
        ← Atpakaļ uz komandu
    </a>
</p>

<h1>Izveidot komandu</h1>

<div class="card form-card">

    {% if error %}
        <p class="error-message">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <p>
            <label for="team_name">
                Komandas nosaukums
            </label>

            <input
                type="text"
                id="team_name"
                name="team_name"
                placeholder="Piemēram: IT komanda"
                required
            >
        </p>

        <button type="submit">
            Izveidot komandu
        </button>

    </form>

</div>

{% endblock %}
